name: Publish

on:
  workflow_run:
    workflows: [ "Build" ]
    branches: [ "development" ]
    types: [ completed ]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup permissions
        run: chmod +x ./gradlew

      # `publish` depends on `build` internally, so this compiles, tests,
      # and uploads to the "Reposilite" maven repo defined in
      # build.gradle.kts in one step. The published filename is lowercase
      # because `base.archivesName` is set to `project.name.lowercase()`
      # in build.gradle.kts — that's what maven-publish actually reads,
      # not anything in build/libs.
      - name: Publish
        env:
          MAVEN_USERNAME: ${{ secrets.REPOSILITE_USER }}
          MAVEN_PASSWORD: ${{ secrets.REPOSILITE_TOKEN }}
        run: ./gradlew publish --no-daemon