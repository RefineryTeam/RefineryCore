name: Build

on:
  push:
    branches: [ "development" ]
    paths-ignore: [ "README.md", "gradlew*" ]
  pull_request:
    branches: [ "development" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup permissions
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      # Cosmetic only — matches the lowercase naming used when publishing,
      # so the artifact attached to this workflow run matches the jar that
      # will eventually land in Reposilite. The publish workflow does not
      # read from this artifact; it re-runs `./gradlew publish`, which
      # names the real uploaded jar via `base.archivesName` in build.gradle.kts.
      - name: Lowercase jar filename
        run: |
          cd build/libs
          for f in *.jar; do
            lower=$(echo "$f" | tr '[:upper:]' '[:lower:]')
            if [ "$f" != "$lower" ]; then
              mv -- "$f" "$lower"
            fi
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*.jar
          retention-days: 7
          if-no-files-found: error